name: Update profile telemetry

on:
  push:
    branches:
      - main
    paths:
      - "profile.json"
      - "stats/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate telemetry dashboard
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/generate_profile.py

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg assets/activity.svg assets/stack.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh telemetry dashboard"
          git pull --rebase origin main
          git push origin main
